name: Monthly Factor Refresh

# First calendar day each month, 22:30 UTC (after US close). Formation uses
# the prior month-end, so the exact weekday does not matter.
# The pushed commit also resets GitHub's 60-day scheduled-workflow timer.
on:
  schedule:
    - cron: '30 22 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # research/cache is licensed Tiingo data: kept OUT of git (public repo),
      # persisted between runs via actions/cache. On a cold cache the fetch
      # downloads everything; the guard below stops the build if rate limits
      # left the download incomplete (re-run later to resume).
      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: research/cache
          key: tiingo-cache-${{ github.run_id }}
          restore-keys: tiingo-cache-

      - name: Refresh prices (current members + ETFs)
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python research/fetch_data.py --refresh

      - name: Save price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: research/cache
          key: tiingo-cache-${{ github.run_id }}

      - name: Guard incomplete data
        run: |
          n=$(ls research/cache | wc -l)
          echo "cache files: $n"
          if [ "$n" -lt 200 ]; then echo "cache incomplete (<200 tickers)"; exit 1; fi
          if grep -q "429" research/data/coverage_gaps.txt; then
            echo "rate-limited fetch; resume on next run"; exit 1
          fi

      - name: Build factor sleeve
        run: python research/build_factor.py

      - name: Export research-note data
        run: python research/export_note_data.py

      - name: Rebuild static site
        run: python research/build_site.py

      - name: Commit and push
        run: |
          git add research/data research/output web/data site
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(pipeline): monthly factor refresh"
            git push
          fi

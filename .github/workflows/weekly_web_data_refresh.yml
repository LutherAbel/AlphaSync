name: Weekly Web Data Refresh

on:
  schedule:
    - cron: '30 22 * * 5' # Friday 22:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-web-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate web data JSON
        run: python scripts/generate_data.py

      - name: Commit and push data updates
        run: |
          if [ -n "$(git status --porcelain web/data)" ]; then
            git add web/data
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(data): refresh web data"
            git push
          else
            echo "No web/data changes to commit."
          fi
